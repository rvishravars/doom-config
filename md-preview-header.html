<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { max-width: 80vw; margin: 2rem auto; padding: 0 1rem; font: 16px/1.6 system-ui, sans-serif; }
  table { border-collapse: collapse; margin: 1rem 0; }
  th, td { border: 1px solid #8884; padding: 6px 12px; }
  th { background: #8882; }
  pre, div.sourceCode { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 6px; }
  pre { padding: 12px 16px; overflow-x: auto; }
  div.sourceCode pre { border: 0; background: transparent; margin: 0; }
  code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.9em; }
  :not(pre) > code { background: #afb8c133; padding: 0.15em 0.4em; border-radius: 4px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    pre, div.sourceCode { background: #161b22; border-color: #30363d; }
    a { color: #58a6ff; }
  }
  .mermaid { margin: 1rem 0; text-align: center; }
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
  // pandoc emits <pre class="mermaid"><code>…</code></pre>; mermaid wants plain text in a div.
  document.querySelectorAll('pre.mermaid').forEach(p => {
    const d = document.createElement('div');
    d.className = 'mermaid';
    d.textContent = p.textContent;
    p.replaceWith(d);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run({ querySelector: '.mermaid' });
</script>
